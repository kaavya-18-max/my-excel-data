<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BuddyDate · TeenCab</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300,0,9..40,400,0,9..40,500,0,9..40,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --coral:    #FF5757;
      --bg:       #F9F9F9;
      --surface:  #FFFFFF;
      --text:     #1A1A1A;
      --sub:      #8E8E93;
      --card-r:   32px;
      /* Updated to match the deep violet in the image */
      --nav-purple: #6D28D9; 
      --nav-dark: #4C1D95;
      --nav-gradient: linear-gradient(180deg, #8B5CF6 0%, #4C1D95 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { touch-action: none; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ══ PHONE FRAME ══ */
    .phone {
      width: 375px; 
      height: 812px;
      background: var(--bg);
      border-radius: 44px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.7) inset;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .notch {
      position: absolute; top: 12px; left: 50%;
      transform: translateX(-50%);
      width: 110px; height: 30px;
      background: #000;
      border-radius: 99px;
      z-index: 999;
    }

    .status {
      position: absolute; top: 6px; left: 0; right: 0;
      height: 48px;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 24px 6px; z-index: 998;
    }
    .status span { font-size: 12px; font-weight: 600; color: var(--text); opacity: .8; }

    /* ══ HEADER ══ */
    .header {
      padding: 60px 24px 0;
      display: flex; justify-content: space-between; align-items: flex-start;
      flex-shrink: 0;
    }
    .buddy-brand { display: flex; flex-direction: column; line-height: 1.1; }
    .buddy-main {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 26px;
      color: var(--text); letter-spacing: -0.5px;
    }
    .buddy-main em { font-style: normal; color: var(--coral); }
    .buddy-sub {
      font-size: 9px; font-weight: 700; color: var(--sub);
      letter-spacing: 1px; text-transform: uppercase; margin-top: 4px;
    }
    .buddy-sub span { color: var(--coral); }

    .vibe-progress { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .vibe-progress-label { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--sub); }
    .vibe-count-text { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1; }
    .vibe-count-text span { font-size: 12px; font-weight: 500; color: var(--sub); }

    .progress-strip { margin: 15px 24px 0; height: 3px; background: rgba(0,0,0,.05); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--coral), #FFAA3B); width: 0%; transition: width .5s ease; }

    .hint-row { padding: 12px 24px 0; }
    .hint-text { font-size: 12px; font-weight: 500; color: var(--sub); }

    /* ══ CARD STACK ══ */
    .stack-area { flex: 1; position: relative; margin: 15px 0 0; overflow: hidden; }
    .card { 
      position: absolute; left: 20px; right: 20px; bottom: 140px; top: 10px; z-index: 2; 
      background: var(--surface); border-radius: var(--card-r); overflow: hidden; 
      user-select: none; will-change: transform; 
      box-shadow: 0 15px 35px rgba(0,0,0,.12); 
    }
    .card.behind-1 { z-index: 1; pointer-events: none; transform: scale(0.956) translateY(16px); }
    .card.behind-2 { z-index: 0; pointer-events: none; transform: scale(0.912) translateY(32px); opacity: .72; }
    .card.top { z-index: 10; cursor: grab; }
    .card.top.is-dragging { cursor: grabbing; }
    
    .card-img-wrap { height: 60%; position: relative; overflow: hidden; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; display: block; }
    
    .stamp { position: absolute; top: 26px; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; padding: 6px 14px; border-radius: 8px; border: 2.5px solid; opacity: 0; pointer-events: none; z-index: 20; }
    .stamp-like { right: 16px; color: #22D3A5; border-color: #22D3A5; background: rgba(34,211,165,.1); }
    .stamp-nope { left: 16px; color: var(--coral); border-color: var(--coral); background: rgba(255,87,87,.1); }
    
    .card-body { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .card-header-row { display: flex; align-items: center; gap: 10px; }
    .card-icon { width: 24px; height: 24px; border-radius: 6px; background: #FFEBEE; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .card-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
    .card-desc { font-size: 13px; color: var(--sub); line-height: 1.5; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tag { font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 99px; background: #F2F2F7; color: var(--text); }

    /* ══ BOTTOM NAV & ACTIONS ══ */
    .nav {
      position: relative;
      height: 110px;
      width: 100%;
      flex-shrink: 0;
    }

    .nav-svg {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 110px;
      filter: drop-shadow(0 -4px 12px rgba(0,0,0,0.15));
    }

    .nav-items-row {
      position: absolute;
      bottom: 15px; left: 0; right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 5;
      padding: 0 10px;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.5);
      cursor: pointer; width: 60px;
    }
    .nav-item.active { color: #fff; }
    .nav-item span { font-size: 20px; }

    .nav-centre-slot { width: 70px; flex-shrink: 0; }

    .nav-actions-group {
      position: absolute;
      bottom: 70px; 
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 110px;
      z-index: 10;
    }

    .btn-action-circ {
      width: 56px;
      height: 56px;
      background: var(--nav-purple);
      box-shadow: 0 8px 20px rgba(76,29,149,0.3);
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    .btn-vibe-main {
      width: 72px;
      height: 72px;
      font-size: 30px;
      transform: translateY(15px);
      background: var(--nav-purple);
    }
    .btn-action-circ:active { transform: scale(0.88); }

    /* ══ RESULTS SCREEN ══ */
    #result-screen {
      position: absolute; inset: 0; z-index: 300;
      display: flex; flex-direction: column;
      opacity: 0; pointer-events: none;
      transform: translateY(100%);
      transition: transform .65s cubic-bezier(.34,1.1,.64,1), opacity .4s ease;
      overflow: hidden;
    }
    #result-screen.show { opacity: 1; pointer-events: all; transform: translateY(0); }
    .result-full-bg { position: absolute; inset: 0; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0; transition: opacity 1.2s ease; }
    #result-screen.show .orb { opacity: 1; }
    .orb-1 { width: 300px; height: 300px; top: -100px; left: -80px; }
    .orb-2 { width: 220px; height: 220px; top: 20%; right: -70px; }
    .result-grid { position: absolute; inset: 0; z-index: 1; background-image: linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px); background-size: 36px 36px; }
    .result-content { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100%; }
    .result-top { padding: 52px 24px 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .result-big-emoji { font-size: 72px; display: block; }
    .result-profile-title { font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 800; color: #fff; line-height: 1; }
    .result-divider { width: 40px; height: 2.5px; background: #fff; border-radius: 99px; margin: 12px auto 0; }
    .result-stats { display: flex; margin: 16px 0 0; width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); }
    .stat-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 6px; background: rgba(255,255,255,.07); border-right: 1px solid rgba(255,255,255,.07); }
    .stat-val { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; color: #fff; }
    .stat-lbl { font-size: 8px; font-weight: 600; color: rgba(255,255,255,.4); text-transform: uppercase; }
    .result-bottom { flex: 1; border-radius: 26px 26px 0 0; margin-top: 20px; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; position: relative; }
    .result-desc-text { font-size: 13px; color: rgba(255,255,255,.75); line-height: 1.6; }
    .uniqueness-section { display: flex; flex-direction: column; gap: 8px; }
    .uniqueness-label { font-size: 9px; font-weight: 700; color: rgba(255,255,255,.4); text-transform: uppercase; }
    .rarity-row { display: flex; align-items: center; gap: 10px; }
    .rarity-name { font-size: 10px; color: #fff; width: 68px; }
    .rarity-track { flex: 1; height: 5px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
    .rarity-fill { height: 100%; background: #fff; width: 0; transition: width 1s ease; }
    .rarity-pct { font-size: 10px; color: #fff; width: 30px; text-align: right; }
    .trait-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .trait-chip { padding: 6px 12px; border-radius: 99px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.1); }
    .trait-chip.hot { background: #fff; color: var(--text); }
    .btn-find-buddy { width: 100%; padding: 15px; background: #fff; color: var(--text); border: none; border-radius: 16px; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; }
    .btn-share-row { display: flex; gap: 8px; }
    .btn-share-main { flex: 1; padding: 12px; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; cursor: pointer; font-size: 13px; }

    @keyframes cardIn { from { opacity:0; transform:scale(.96) translateY(10px); } to { opacity:1; transform:none; } }
    .card.top { animation: cardIn .3s ease forwards; }
    .card.top.is-dragging { animation: none; }
  </style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="header">
    <div class="buddy-brand">
      <div class="buddy-main">Buddy<em>Date</em></div>
      <div class="buddy-sub">by <span>TeenCab</span></div>
    </div>
    <div class="vibe-progress">

  <div class="progress-strip"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="hint-row">

  </div>

  <div class="stack-area" id="stack"></div>

  <div class="nav">
    <svg class="nav-svg" viewBox="0 0 375 110" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 110 
               L 0 20 
               C 100 20, 130 20, 160 55 
               C 180 85, 210 85, 230 55 
               C 260 20, 290 20, 375 20 
               L 375 110 
               Z" fill="url(#navGrad)"/>
      <defs>
        <linearGradient id="navGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#4C1D95;stop-opacity:1" />
        </linearGradient>
      </defs>
    </svg>

    <div class="nav-items-row">
      <div class="nav-item"><span>🏠</span>Home</div>
      <div class="nav-item active"><span>✨</span>BuddyDate</div>
      <div class="nav-centre-slot"></div>
      <div class="nav-item"><span>💬</span>Chats</div>
      <div class="nav-item"><span>👤</span>Me</div>
    </div>

    <div class="nav-actions-group">
      <button class="btn-action-circ" id="btn-nope">✕</button>
      <button 
  class="btn-action-circ" 
  id="btn-nope" 
  style="transform: translateY(-30px);">
  ✕
</button>
      <button class="btn-action-circ btn-vibe-main" id="btn-like">⚡️</button>
      <button class="btn-action-circ" id="btn-super" style="margin-top:-50px;">★</button>
      <button 
  class="btn-action-circ" 
  id="btn-super" 
  style="transform: translateY(-30px);">
  ★
</button>
    </div>
  </div>

  <div id="result-screen">
    <div class="result-full-bg" id="result-full-bg"></div>
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>
    <div class="result-grid"></div>
    <div class="result-content">
      <div class="result-top">
        <div class="result-emoji-wrap"><span class="result-big-emoji" id="res-emoji">🎨</span></div>
        <div class="result-profile-title" id="res-title">The Creative Soul</div>
        <div class="result-divider"></div>
        <div class="result-stats">
          <div class="stat-item"><div class="stat-val" id="stat-rarity-val">—</div><div class="stat-lbl">Rarity</div></div>
          <div class="stat-item"><div class="stat-val" id="stat-rank">—</div><div class="stat-lbl">Rank</div></div>
          <div class="stat-item"><div class="stat-val" id="stat-users">—</div><div class="stat-lbl">Users</div></div>
          <div class="stat-item"><div class="stat-val" id="stat-match">—</div><div class="stat-lbl">Match</div></div>
        </div>
      </div>
      <div class="result-bottom" id="result-bottom">
        <p class="result-desc-text" id="res-desc"></p>
        <div class="uniqueness-section">
          <div class="uniqueness-label">Vibe Rarity</div>
          <div id="rarity-bars"></div>
        </div>
        <div class="trait-chips" id="res-chips"></div>
        <div class="result-cta">
          <button class="btn-find-buddy" onclick="restart()">🚗 Find My Buddy</button>
          <div class="btn-share-row">
            <button class="btn-share-main" id="btn-share">Share Vibe</button>
            <button class="btn-share-main" style="flex:0 0 60px;" onclick="restart()">↩</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

const categoryPopulation = { creative: 18, gaming: 22, sports: 20, music: 12, tech: 10, business: 7, learning: 6, lifestyle: 5 };
const NEED_APPROVALS = 4;
let queue = [], queueIndex = 0, approvals = 0, pickedCats = [];
const heroColors = { creative: "#E8445A", tech: "#3B9FDB", music: "#8B7AFF", sports: "#17C99A", gaming: "#4B80F7", business: "#F0A020", learning: "#7BC220", lifestyle: "#F0703A", default: "#E8445A" };
const profiles = {
  creative: { title: "The Creative Soul", emoji: "🎨", desc: "You see the world differently — every surface is a canvas, every moment potential content.", chips: ["Visionary","Artist","Storyteller"], rarityBars: [{ name: "Creative", pct: 18 }, { name: "Expressive", pct: 31 }, { name: "Aesthetic", pct: 27 }], rarityLabel: "Selective", rank: "Top 18%", matchPct: "94%" },

  lifestyle: { title: "The Connector", emoji: "🌍", desc: "You collect experiences, stories, and people. Your energy brings everyone together.", chips: ["Explorer","Warm","Social"], rarityBars: [{ name: "Social", pct: 5 }, { name: "Adventurous", pct: 22 }, { name: "Empathetic", pct: 38 }], rarityLabel: "Ultra Rare", rank: "Top 5%", matchPct: "99%" },
  default: { title: "The One-of-a-Kind", emoji: "🌟", desc: "No single box fits you — you're a bit of everything. Unexpected, interesting, and genuinely rare.", chips: ["Unique","Open","Eclectic"], rarityBars: [{ name: "Unique", pct: 3 }, { name: "Versatile", pct: 45 }, { name: "Open", pct: 60 }], rarityLabel: "Legendary", rank: "Top 3%", matchPct: "100%" }
};

function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function initQueue() { queue = shuffle(ALL_CARDS); queueIndex = 0; approvals = 0; pickedCats = []; updateUI(); }
function updateUI() { document.getElementById('counter-num').innerHTML = `${approvals}<span>/4</span>`; document.getElementById('progress-fill').style.width = `${(approvals / 4) * 100}%`; }
function buildCard(data, depthClass) {
  const c = document.createElement('div'); c.className = 'card ' + depthClass;
  c.innerHTML = `<div class="stamp stamp-like">VIBE ⚡</div><div class="stamp stamp-nope">PASS ✕</div><div class="card-img-wrap"><img src="${data.img}" alt="${data.title}"></div><div class="card-body"><div class="card-header-row"><div class="card-icon">${data.emoji}</div><div class="card-title">${data.title}</div></div><div class="card-desc">${data.desc}</div><div class="card-tags">${data.tags.map((t,i)=>`<div class="tag">#${t}</div>`).join('')}</div></div>`;
  return c;
}

const stackEl = document.getElementById('stack');
function renderStack() {
  stackEl.innerHTML = '';
  for (let offset = 2; offset >= 0; offset--) {
    const idx = queueIndex + offset;
    if (idx >= queue.length) continue;
    const depth = offset === 0 ? 'top' : offset === 1 ? 'behind-1' : 'behind-2';
    const card = buildCard(queue[idx], depth);
    if (offset === 0) attachSwipe(card, queue[idx]);
    stackEl.appendChild(card);
  }
  updateUI();
}

// ══ SWIPE ENGINE (UNTOUCHED) ══
function attachSwipe(card, data) {
  const stampLike = card.querySelector('.stamp-like'), stampNope = card.querySelector('.stamp-nope');
  let active = false, startX = 0, startY = 0, curX = 0, curY = 0, velX = 0, prevClientX = 0, prevT = 0, rafId = null, decided = false, isVertical = false, rendX = 0, rendY = 0;

  function renderFrame() {
    rafId = null;
    if (!active && !decided) {
      rendX += (0 - rendX) * 0.22; rendY += (0 - rendY) * 0.22;
      if (Math.abs(rendX) > 0.1 || Math.abs(rendY) > 0.1) { applyTransform(rendX, rendY); rafId = requestAnimationFrame(renderFrame); }
      else { rendX = 0; rendY = 0; applyTransform(0, 0); stampLike.style.opacity = '0'; stampNope.style.opacity = '0'; 
        const b1 = stackEl.querySelector('.card.behind-1'); const b2 = stackEl.querySelector('.card.behind-2');
        if (b1) b1.style.transform = ''; if (b2) b2.style.transform = ''; }
      return;
    }
    if (!active) return;
    rendX = curX; rendY = curY * 0.15;
    applyTransform(rendX, rendY);
    
    const thresh = 25;
    if (rendX > thresh) { stampLike.style.opacity = Math.min((rendX - thresh) / 60, 1); stampNope.style.opacity = '0'; }
    else if (rendX < -thresh) { stampNope.style.opacity = Math.min((-rendX - thresh) / 60, 1); stampLike.style.opacity = '0'; }
    else { stampLike.style.opacity = '0'; stampNope.style.opacity = '0'; }

    const prog = Math.min(Math.abs(rendX) / 100, 1);
    const b1 = stackEl.querySelector('.card.behind-1'); const b2 = stackEl.querySelector('.card.behind-2');
    if (b1) { const s = 0.956 + prog * 0.044; const ty = 16 * (1 - prog); b1.style.transform = `scale(${s.toFixed(4)}) translateY(${ty.toFixed(1)}px)`; b1.style.transition = 'none'; }
    if (b2) { const s = 0.912 + prog * 0.044; const ty = 32 * (1 - prog * 0.5); const op = 0.72 + prog * 0.18; b2.style.transform = `scale(${s.toFixed(4)}) translateY(${ty.toFixed(1)}px)`; b2.style.opacity = op.toFixed(3); b2.style.transition = 'none'; }
    rafId = requestAnimationFrame(renderFrame);
  }

  function applyTransform(x, y) { card.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) rotate(${(x / 16).toFixed(3)}deg)`; }
  function onStart(e) {
    if (decided) return;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY; prevClientX = pt.clientX; prevT = Date.now();
    active = true; isVertical = false;
    card.classList.add('is-dragging'); card.style.transition = 'none'; card.style.animation = 'none';
    if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(renderFrame);
  }
  function onMove(e) {
    if (!active || decided) return;
    const pt = e.touches ? e.touches[0] : e;
    curX = pt.clientX - startX; curY = pt.clientY - startY;
    if (Math.abs(curY) > Math.abs(curX) * 1.6 && Math.abs(curY) > 8) { isVertical = true; active = false; }
    const now = Date.now(); const dt = now - prevT;
    if (dt > 0) velX = (pt.clientX - prevClientX) / dt;
    prevClientX = pt.clientX; prevT = now;
  }
  function onEnd() {
    if (!active || decided) return;
    active = false; card.classList.remove('is-dragging');
    if (curX > 88 || velX > 0.42) { decided = true; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } flyOut('right'); }
    else if (curX < -88 || velX < -0.42) { decided = true; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } flyOut('left'); }
    else { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(renderFrame); }
  }
  function flyOut(dir) {
    stampLike.style.opacity = '0'; stampNope.style.opacity = '0'; cleanup();
    const targetX = dir === 'right' ? 500 : -500; const targetRot = dir === 'right' ? 28 : -28;
    card.style.transition = 'transform 0.34s cubic-bezier(0.4,0,1,1), opacity 0.34s ease';
    card.style.transform = `translate3d(${targetX}px, ${rendY.toFixed(1)}px, 0) rotate(${targetRot}deg)`;
    card.style.opacity = '0';
    const b1 = stackEl.querySelector('.card.behind-1'); const b2 = stackEl.querySelector('.card.behind-2');
    if (b1) { b1.style.transition = 'transform .32s cubic-bezier(.34,1.3,.64,1)'; b1.style.transform = ''; }
    if (b2) { b2.style.transition = 'transform .32s cubic-bezier(.34,1.3,.64,1)'; b2.style.transform = ''; b2.style.opacity = ''; }
    dismiss(card, dir, data);
  }
  function cleanup() {
    card.removeEventListener('mousedown', onStart); card.removeEventListener('touchstart', onStart);
    document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onEnd);
  }
  card._cleanup = cleanup;
  card.addEventListener('mousedown', onStart); card.addEventListener('touchstart', onStart, { passive: true });
  document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchmove', onMove, { passive: true }); document.addEventListener('touchend', onEnd, { passive: true });
}

function dismiss(card, dir, data) {
  if (dir === 'right') { pickedCats.push(data.category); approvals = Math.min(approvals + 1, NEED_APPROVALS); updateUI(); }
  queueIndex++;
  if (queueIndex >= queue.length && approvals < NEED_APPROVALS) queue = [...queue, ...shuffle(ALL_CARDS)];
  setTimeout(() => { if (approvals >= NEED_APPROVALS) showResult(); else renderStack(); }, 350);
}

document.getElementById('btn-like').addEventListener('click', () => {
  const top = stackEl.querySelector('.card.top'); if (!top) return;
  if (top._cleanup) top._cleanup();
  top.style.transition = 'transform 0.32s cubic-bezier(0.4,0,1,1), opacity 0.32s ease';
  top.style.transform = 'translate3d(500px,0,0) rotate(28deg)'; top.style.opacity = '0';
  const b1 = stackEl.querySelector('.card.behind-1'); const b2 = stackEl.querySelector('.card.behind-2');
  if (b1) { b1.style.transition = 'transform .32s cubic-bezier(.34,1.3,.64,1)'; b1.style.transform = ''; }
  if (b2) { b2.style.transition = 'transform .32s cubic-bezier(.34,1.3,.64,1)'; b2.style.transform = ''; b2.style.opacity = ''; }
  dismiss(top, 'right', queue[queueIndex]);
});

document.getElementById('btn-nope').addEventListener('click', () => {
  const top = stackEl.querySelector('.card.top'); if (!top) return;
  if (top._cleanup) top._cleanup();
  top.style.transition = 'transform 0.32s cubic-bezier(0.4,0,1,1), opacity 0.32s ease';
  top.style.transform = 'translate3d(-500px,0,0) rotate(-28deg)'; top.style.opacity = '0';
  const b1 = stackEl.querySelector('.card.behind-1');
  if (b1) { b1.style.transition = 'transform .32s cubic-bezier(.34,1.3,.64,1)'; b1.style.transform = ''; }
  dismiss(top, 'left', queue[queueIndex]);
});

document.getElementById('btn-super').addEventListener('click', () => {
  const top = stackEl.querySelector('.card.top'); if (!top) return;
  if (top._cleanup) top._cleanup();
  top.style.transition = 'transform 0.32s cubic-bezier(0.4,0,1,1), opacity 0.32s ease';
  top.style.transform = 'translate3d(500px,0,0) rotate(28deg)'; top.style.opacity = '0';
  const b1 = stackEl.querySelector('.card.behind-1');
  if (b1) { b1.style.transition = 'transform .32s cubic-bezier(.34,1.3,.64,1)'; b1.style.transform = ''; }
  dismiss(top, 'right', queue[queueIndex]);
});

function showResult() {
  const counts = pickedCats.reduce((a, c) => { a[c] = (a[c]||0)+1; return a; }, {});
  const topCat = Object.keys(counts).sort((a,b) => counts[b]-counts[a])[0] || 'default';
  const prof = profiles[topCat] || profiles.default;
  const color = heroColors[topCat] || heroColors.default;
  const pop = categoryPopulation[topCat] || 5;
  const baseUsers = Math.round((pop / 100) * 180000);
  const usersStr = baseUsers >= 1000 ? `${(baseUsers/1000).toFixed(1)}k` : baseUsers.toString();
  document.getElementById('result-full-bg').style.background = `linear-gradient(160deg, ${color}55 0%, #0f0f1a 60%)`;
  document.getElementById('orb1').style.background = color;
  document.getElementById('orb2').style.background = color + 'bb';
  document.getElementById('result-bottom').style.background = `linear-gradient(160deg, ${color}ee 0%, ${color}cc 100%)`;
  document.getElementById('stat-rarity-val').textContent = prof.rarityLabel;
  document.getElementById('stat-rank').textContent = prof.rank;
  document.getElementById('stat-users').textContent = usersStr;
  document.getElementById('stat-match').textContent = prof.matchPct;
  document.getElementById('res-emoji').textContent = prof.emoji;
  document.getElementById('res-title').textContent = prof.title;
  document.getElementById('res-desc').textContent = prof.desc;
  document.getElementById('res-chips').innerHTML = prof.chips.map((c,i)=>`<div class="trait-chip${i===0?' hot':''}">${c}</div>`).join('');
  const barsEl = document.getElementById('rarity-bars');
  barsEl.innerHTML = prof.rarityBars.map(b => `<div class="rarity-row"><div class="rarity-name">${b.name}</div><div class="rarity-track"><div class="rarity-fill" data-pct="${b.pct}"></div></div><div class="rarity-pct">${b.pct}%</div></div>`).join('');
  document.getElementById('result-screen').classList.add('show');
  setTimeout(() => { barsEl.querySelectorAll('.rarity-fill').forEach(el => { el.style.width = el.dataset.pct + '%'; }); }, 600);
}

function restart() {
  document.getElementById('result-screen').classList.remove('show');
  setTimeout(() => { initQueue(); renderStack(); }, 300);
}

initQueue();
renderStack();
